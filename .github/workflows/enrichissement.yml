# Enrichissement d'une offre, à la demande.
#
# Déclenché par l'INTERFACE, qui appelle l'API GitHub au clic sur « Enrichir »
# (`interface/lib/github.ts`). Pas de `schedule` ici, et c'est le cœur du
# dispositif : un cron ne descend pas sous cinq minutes et se déclenche avec dix
# à quinze minutes de retard sur ce dépôt — trois nuits mesurées, retards de
# 10 h 32 et 12 h 02. Montrer l'agent travailler en entretien est un objectif
# produit explicite ; il n'y survivrait pas.
#
# ⚠️ LES JOURNAUX DE CE WORKFLOW SONT PUBLICS, le dépôt l'étant. Le module
# `pipeline/enrichissement.py` ne journalise que des identifiants et des
# compteurs — jamais le texte d'une annonce, un nom de contact, ni une étape
# rédigée. Tout cela part en base. Toute trace ajoutée ici doit tenir la règle.
#
# ⚠️ ET LES ENTRÉES D'UN `workflow_dispatch` SONT VISIBLES elles aussi, dans
# l'onglet Actions. C'est pourquoi le seul paramètre transmis est un NUMÉRO de
# tentative : le script résout l'offre par la base. Rien d'identifiant, rien de
# personnel, ne transite par ce canal.

name: Enrichissement à la demande

on:
  workflow_dispatch:
    inputs:
      enrichissement_id:
        description: "Identifiant de la tentative à servir (table enrichissements)."
        required: true

# Moindre privilège : ce job lit le code et écrit en base. Il n'a aucune raison
# de pousser un commit, d'ouvrir une issue ou de publier un paquet.
permissions:
  contents: read

# ⚠️ Le groupe porte l'identifiant de la TENTATIVE, pas un nom fixe. Deux
# enrichissements sur deux offres différentes doivent pouvoir tourner ensemble —
# les sérialiser ferait attendre le second derrière le premier, alors que rien
# ne les lie. Deux exécutions pour la MÊME tentative, en revanche, écriraient les
# mêmes étapes deux fois : la contrainte `un_seul_rang_par_enrichissement` les
# refuserait, mais autant ne pas en arriver là.
#
# `cancel-in-progress: false` : annuler une exécution en vol laisserait la ligne
# `en_cours` jusqu'à la péremption. On préfère faire la queue.
concurrency:
  group: enrichissement-${{ inputs.enrichissement_id }}
  cancel-in-progress: false

jobs:
  enrichir:
    name: Enrichir une offre
    runs-on: ubuntu-latest

    # ⚠️ HUIT minutes, et ce timeout n'est QU'UN FILET — c'est le changement le
    # plus important de la tranche 6.3, et il se lit à l'envers de l'intuition.
    #
    # La borne qui compte est désormais `DUREE_MAX_SECONDES` dans
    # `pipeline/enrichissement.py` — **300 s depuis la phase 7** : à son
    # expiration, l'agent s'arrête et le script ÉCRIT ce qu'il avait trouvé. Un
    # job tué par GitHub, lui, ne conclut rien — la ligne reste `en_cours`,
    # l'écran pulse jusqu'à la péremption, et les tokens déjà brûlés sont perdus
    # pour l'enveloppe du jour. Le filet doit donc rester NETTEMENT au-dessus de
    # la borne interne, sans quoi c'est lui qui mord et on perd la conclusion
    # propre.
    #
    # ⚠️ **MESURÉ le 31 août 2026 sur deux exécutions réelles, et la version
    # précédente de ce commentaire se trompait de raison.** Elle justifiait les
    # 8 minutes par le poids des dépendances — « ~190 Mo, le SDK embarque son
    # binaire Claude Code » — en laissant croire que l'installation mangeait une
    # part sérieuse du budget. Relevé au chronomètre de GitHub : récupération du
    # code, installation de Python et des dépendances prennent **8 à 11
    # secondes**, et tout ce qui n'est pas l'agent tient en **~15 secondes**.
    # Le poids d'un téléchargement ne dit rien de sa durée quand le réseau du
    # runner est celui d'un centre de données.
    #
    # Le budget réel est donc : 300 s d'agent + ~15 s de mise en place = ~5 min
    # 15, **contre 8 min de filet — presque 3 minutes de marge**. Le chiffre de
    # 8 était bon, sa justification ne l'était pas.
    #
    # ⚠️ **Le plafond, lui, ne vient PAS de la durée du job mais des 10 min de
    # `PEREMPTION_MINUTES`** (`interface/lib/enrichissement.ts`), au-delà
    # desquelles l'interface déclare la tentative morte. Dépasser 10 ferait
    # conclure un enrichissement que l'écran a déjà annoncé perdu. C'est cette
    # borne-là qu'il faudra bouger en premier si l'agent doit un jour explorer
    # plus longtemps, pas le `timeout` ci-dessous.
    timeout-minutes: 8

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Installer les dépendances
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Enrichir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # ⚠️ ENTRÉE LE 30 AOÛT 2026 AVEC L'AGENT RÉEL (tranche 6.3). Ce
          # workflow détient désormais une clé FACTURÉE : qui peut le lancer
          # peut faire dépenser. Deux conséquences opposables :
          #   · `JETON_GITHUB`, côté interface, doit rester à portée fine, sur
          #     ce seul dépôt, avec la seule permission « Actions : write ».
          #     Un jeton large offrirait cette clé à qui le trouverait.
          #   · L'agent est borné trois fois (tours, dollars, durée) dans
          #     `pipeline/enrichissement.py`, et l'enveloppe quotidienne borne
          #     l'ensemble côté interface. Aucune de ces bornes n'est
          #     décorative.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ⚠️ L'entrée passe par l'ENVIRONNEMENT, jamais interpolée dans la
          # ligne de commande. `run: python … --id ${{ inputs.… }}` ferait
          # exécuter par le shell tout ce qu'un déclencheur y écrirait — le
          # jeton GitHub n'autorise que le lancement, mais la parade ne coûte
          # rien et ne dépend pas de la portée d'un jeton qui peut changer.
          ENRICHISSEMENT_ID: ${{ inputs.enrichissement_id }}
        run: python -m pipeline.enrichissement --id "$ENRICHISSEMENT_ID"
